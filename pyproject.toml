[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recruit-cli"
dynamic = ["version"]  # single source: recruit_cli/__init__.py (see [tool.hatch.version])
description = "AI-powered CV screening CLI — ranks candidates against a Job Description using Google Gemini and pushes results to Notion"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "kneeraazon404" }]
keywords = ["recruitment", "cv", "screening", "gemini", "notion", "cli", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "typer",
    "rich",
    "python-dotenv",
    "google-genai",
    "notion-client",
    "pdfplumber",
    "python-docx",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
recruit-cli = "recruit_cli.main:app"
# Deprecated alias kept for one release cycle so existing scripts keep working; prints a notice on stderr.
ai-recruit = "recruit_cli.main:deprecated_alias"

[project.urls]
Homepage = "https://github.com/karkinirajan/recruit-cli"
Repository = "https://github.com/karkinirajan/recruit-cli"
Issues = "https://github.com/karkinirajan/recruit-cli/issues"
Changelog = "https://github.com/karkinirajan/recruit-cli/blob/master/CHANGELOG.md"

[tool.hatch.version]
path = "recruit_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["recruit_cli"]

# An allowlist, not an exclude list: a local build otherwise sweeps in any untracked file in the folder (.env, CVs, tool logs).
[tool.hatch.build.targets.sdist]
include = [
    "/recruit_cli",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["tests/mutation"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
